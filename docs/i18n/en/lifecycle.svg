<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 676" width="1000" height="676" role="img"
     aria-labelledby="lifeTitle lifeDesc"
     font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="lifeTitle">Request lifecycle — encryption-rust</title>
  <desc id="lifeDesc">Lifecycle of protected data: configure a 32-byte master key, derive per-algorithm subkeys, register implementations, encrypt with a random IV, store a versioned payload, then parse, verify, and decrypt; plus rotation and failure modes.</desc>

  <defs>
    <marker id="lcArw" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="676" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#0F172A">Request lifecycle</text>
  <text x="40" y="72" font-size="14" fill="#64748B">From master key to plaintext and back — bootstrap, write path, read path, rotation, and failure modes</text>

  <text x="40" y="104" font-size="11" fill="#94A3B8" letter-spacing="1">WRITE PATH</text>
  <text x="40" y="308" font-size="11" fill="#94A3B8" letter-spacing="1">READ PATH</text>

  <!-- ═══ Write path ═══ -->
  <g>
    <rect x="40" y="112" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="66" cy="144" r="15" fill="#EEF2FF"/>
    <text x="66" y="150" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">1</text>
    <text x="90" y="149" font-size="14.5" font-weight="700" fill="#0F172A">Configure</text>
    <line x1="60" y1="168" x2="225" y2="168" stroke="#E2E8F0"/>
    <text x="60" y="194" font-size="11" fill="#475569">32-byte random master key, from</text>
    <text x="60" y="212" font-size="11" fill="#475569">env vars / KMS, never in code.</text>
    <text x="60" y="236" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">load_master_key()</text>
  </g>
  <line x1="245" y1="185" x2="272" y2="185" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="278" y="112" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="304" cy="144" r="15" fill="#EEF2FF"/>
    <text x="304" y="150" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">2</text>
    <text x="328" y="149" font-size="14.5" font-weight="700" fill="#0F172A">Derive</text>
    <line x1="298" y1="168" x2="463" y2="168" stroke="#E2E8F0"/>
    <text x="298" y="194" font-size="11" fill="#475569">One subkey per algorithm,</text>
    <text x="298" y="212" font-size="11" fill="#475569">keys never cross algorithms.</text>
    <text x="298" y="236" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">dgn:derive:aes-gcm</text>
  </g>
  <line x1="483" y1="185" x2="510" y2="185" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="516" y="112" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="542" cy="144" r="15" fill="#EEF2FF"/>
    <text x="542" y="150" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">3</text>
    <text x="566" y="149" font-size="14.5" font-weight="700" fill="#0F172A">Register</text>
    <line x1="536" y1="168" x2="701" y2="168" stroke="#E2E8F0"/>
    <text x="536" y="194" font-size="11" fill="#475569">Implementations register under</text>
    <text x="536" y="212" font-size="11" fill="#475569">their identifier(); unknown errors.</text>
    <text x="536" y="236" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">registry.register(…)</text>
  </g>
  <line x1="721" y1="185" x2="748" y2="185" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="754" y="112" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
    <circle cx="780" cy="144" r="15" fill="#EEF2FF"/>
    <text x="780" y="150" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">4</text>
    <text x="804" y="149" font-size="14.5" font-weight="700" fill="#0F172A">Encrypt</text>
    <line x1="774" y1="168" x2="939" y2="168" stroke="#E2E8F0"/>
    <text x="774" y="194" font-size="11" fill="#475569">Fresh IV / nonce on every call,</text>
    <text x="774" y="212" font-size="11" fill="#475569">AEAD or encrypt-then-MAC.</text>
    <text x="774" y="236" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">manager.encrypt(&amp;data)</text>
  </g>

  <path d="M856 258 V278 H142 V310" fill="none" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>

  <!-- ═══ Read path ═══ -->
  <g>
    <rect x="40" y="316" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#A5B4FC"/>
    <circle cx="66" cy="348" r="15" fill="#EEF2FF"/>
    <text x="66" y="354" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">5</text>
    <text x="90" y="353" font-size="14.5" font-weight="700" fill="#0F172A">Persist</text>
    <line x1="60" y1="372" x2="225" y2="372" stroke="#E2E8F0"/>
    <text x="60" y="398" font-size="11" fill="#475569">Binary into a BLOB column;</text>
    <text x="60" y="416" font-size="11" fill="#475569">text storage, base64 first.</text>
    <text x="60" y="440" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">v1 | IV | Tag/MAC | ciphertext</text>
  </g>
  <line x1="245" y1="389" x2="272" y2="389" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="278" y="316" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#A5B4FC"/>
    <circle cx="304" cy="348" r="15" fill="#EEF2FF"/>
    <text x="304" y="354" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">6</text>
    <text x="328" y="353" font-size="14.5" font-weight="700" fill="#0F172A">Parse</text>
    <line x1="298" y1="372" x2="463" y2="372" stroke="#E2E8F0"/>
    <text x="298" y="398" font-size="11" fill="#475569">The identifier beside the record</text>
    <text x="298" y="416" font-size="11" fill="#475569">picks the implementation — switching</text>
    <text x="298" y="434" font-size="11" fill="#475569">the default, old data still decrypts.</text>
  </g>
  <line x1="483" y1="389" x2="510" y2="389" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="516" y="316" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#A5B4FC"/>
    <circle cx="542" cy="348" r="15" fill="#EEF2FF"/>
    <text x="542" y="354" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">7</text>
    <text x="566" y="353" font-size="14.5" font-weight="700" fill="#0F172A">Verify</text>
    <line x1="536" y1="372" x2="701" y2="372" stroke="#E2E8F0"/>
    <text x="536" y="398" font-size="11" fill="#475569">Check prefix and length, then</text>
    <text x="536" y="416" font-size="11" fill="#475569">constant-time compare Tag / MAC —</text>
    <text x="536" y="434" font-size="11" fill="#475569">any changed byte surfaces here.</text>
    <text x="536" y="452" font-size="10" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">verify_slice / ct_eq</text>
  </g>
  <line x1="721" y1="389" x2="748" y2="389" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#lcArw)"/>
  <g>
    <rect x="754" y="316" width="205" height="146" rx="14" fill="#FFFFFF" stroke="#A5B4FC"/>
    <circle cx="780" cy="348" r="15" fill="#EEF2FF"/>
    <text x="780" y="354" font-size="14" font-weight="700" fill="#4338CA" text-anchor="middle">8</text>
    <text x="804" y="353" font-size="14.5" font-weight="700" fill="#0F172A">Decrypt</text>
    <line x1="774" y1="372" x2="939" y2="372" stroke="#E2E8F0"/>
    <text x="774" y="398" font-size="11" fill="#475569">Plaintext returns to the caller;</text>
    <text x="774" y="416" font-size="11" fill="#475569">on failure, no cause is given —</text>
    <text x="774" y="434" font-size="11" fill="#475569">no detail leaks to the client.</text>
  </g>

  <!-- ═══ Maintenance & failure modes ═══ -->
  <text x="40" y="492" font-size="11" fill="#94A3B8" letter-spacing="1">MAINTENANCE &amp; FAILURE MODES</text>
  <rect x="40" y="504" width="440" height="112" rx="14" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="60" y="532" font-size="13.5" font-weight="700" fill="#9A3412">Rotation and migration</text>
  <circle cx="66" cy="554" r="2.5" fill="#F59E0B"/><text x="78" y="558" font-size="11" fill="#7C2D12">The identifier (v1 prefix included) is stored with each record</text>
  <circle cx="66" cy="573" r="2.5" fill="#F59E0B"/><text x="78" y="577" font-size="11" fill="#7C2D12">Decrypt with the old key, re-encrypt with the new one</text>
  <circle cx="66" cy="592" r="2.5" fill="#F59E0B"/><text x="78" y="596" font-size="11" fill="#7C2D12">set_default_identifier() switches the default; call sites unchanged</text>

  <rect x="520" y="504" width="440" height="112" rx="14" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="540" y="532" font-size="13.5" font-weight="700" fill="#991B1B">Failures are error::Error (typed variants, never silent)</text>
  <circle cx="546" cy="554" r="2.5" fill="#EF4444"/><text x="558" y="558" font-size="11" fill="#7F1D1D">Bad prefix (InvalidPrefix), ciphertext too short (TooShort)</text>
  <circle cx="546" cy="573" r="2.5" fill="#EF4444"/><text x="558" y="577" font-size="11" fill="#7F1D1D">Tag / MAC mismatch — tampering or wrong key</text>
  <circle cx="546" cy="592" r="2.5" fill="#EF4444"/><text x="558" y="596" font-size="11" fill="#7F1D1D">Unknown identifier, invalid key length, zero iterations…</text>

  <text x="40" y="646" font-size="11" fill="#94A3B8">Bootstrap once per process (the factory derives and registers every symmetric algorithm); encrypt / decrypt are the per-request hot path.</text>
  <text x="40" y="664" font-size="10" fill="#94A3B8">Rust's own format: same shape as the PHP version (v1 | IV | Tag/MAC | ciphertext), with no byte-level interop promised.</text>
  <text x="960" y="664" font-size="10" fill="#94A3B8" text-anchor="end">© 2026 erik · https://erik.xyz</text>
</svg>
