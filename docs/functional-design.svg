<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 856" width="1000" height="856" role="img"
     aria-labelledby="fdTitle fdDesc"
     font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fdTitle">功能设计 — encryption-rust</title>
  <desc id="fdDesc">能力地图：对称加密、非对称加密（SM2）、哈希（SHA-256 / SM3）、密钥派生（HKDF）、口令派生（PBKDF2）与国密（SM4 / ZUC），外加设计原则、安全默认值与扩展路径。</desc>

  <rect x="0" y="0" width="1000" height="856" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>

  <text x="40" y="46" font-size="26" font-weight="700" fill="#0F172A">功能设计</text>
  <text x="40" y="72" font-size="14" fill="#64748B">六族能力共享同一结构 —— 契约（trait）· 注册表 · 门面 · 随 crate 交付的标识；外加设计原则、安全默认值与扩展路径</text>

  <!-- ═══ 第一行 ═══ -->
  <!-- 对称加密 -->
  <rect x="40" y="96" width="298" height="164" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="58" y="124" font-size="13.5" font-weight="700" fill="#0F172A">对称加密</text>
  <text x="58" y="142" font-size="9.5" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Registry&lt;dyn SymmetricCipher&gt; · EncryptionManager</text>
  <g font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="58" y="154" width="96" height="20" rx="10" fill="#EEF2FF"/><text x="106" y="168" fill="#4338CA" text-anchor="middle">aes-256-gcm</text>
    <rect x="160" y="154" width="114" height="20" rx="10" fill="#EEF2FF"/><text x="217" y="168" fill="#4338CA" text-anchor="middle">sodium-xchacha20</text>
    <rect x="58" y="180" width="120" height="20" rx="10" fill="#EEF2FF"/><text x="118" y="194" fill="#4338CA" text-anchor="middle">aes-256-cbc-hmac</text>
    <rect x="184" y="180" width="64" height="20" rx="10" fill="#EEF2FF"/><text x="216" y="194" fill="#4338CA" text-anchor="middle">sm4-cbc</text>
    <rect x="254" y="180" width="64" height="20" rx="10" fill="#EEF2FF"/><text x="286" y="194" fill="#4338CA" text-anchor="middle">zuc-128</text>
  </g>
  <text x="58" y="222" font-size="10.5" fill="#475569">实例绑定固定密钥，每次调用新 IV / nonce；</text>
  <text x="58" y="238" font-size="10.5" fill="#475569">二进制载荷，AEAD 或 encrypt-then-MAC。</text>
  <text x="58" y="252" font-size="10" fill="#94A3B8">工厂一次注册全部五个算法。</text>

  <!-- 非对称加密 -->
  <rect x="351" y="96" width="298" height="164" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="369" y="124" font-size="13.5" font-weight="700" fill="#0F172A">非对称加密</text>
  <text x="369" y="142" font-size="9.5" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Registry&lt;dyn AsymmetricCipher&gt; · AsymmetricCryptoManager</text>
  <g font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="369" y="154" width="46" height="20" rx="10" fill="#EEF2FF"/><text x="392" y="168" fill="#4338CA" text-anchor="middle">sm2</text>
  </g>
  <text x="369" y="196" font-size="10.5" fill="#475569">每次调用传入密钥材料：公钥加密、私钥解密。</text>
  <text x="369" y="212" font-size="10.5" fill="#475569">密钥与密文为十六进制；C1C3C2 布局。</text>
  <text x="369" y="228" font-size="10.5" fill="#475569">无 ext-gmp 等扩展门槛，密钥对现成可生成。</text>
  <text x="369" y="248" font-size="10" fill="#94A3B8">Sm2Service 提供静态门面（生成密钥对 / 加解密）。</text>

  <!-- 哈希 -->
  <rect x="662" y="96" width="298" height="164" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="680" y="124" font-size="13.5" font-weight="700" fill="#0F172A">哈希</text>
  <text x="680" y="142" font-size="9.5" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Registry&lt;dyn Hasher&gt; · HashingManager</text>
  <g font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="680" y="154" width="58" height="20" rx="10" fill="#EEF2FF"/><text x="709" y="168" fill="#4338CA" text-anchor="middle">sha256</text>
    <rect x="744" y="154" width="42" height="20" rx="10" fill="#EEF2FF"/><text x="765" y="168" fill="#4338CA" text-anchor="middle">sm3</text>
  </g>
  <text x="680" y="196" font-size="10.5" fill="#475569">单向摘要、无密钥，两者输出均 32 字节。</text>
  <text x="680" y="212" font-size="10.5" fill="#475569">digest() 返回字节，digest_hex() 返回文本</text>
  <text x="680" y="228" font-size="10.5" fill="#475569">（后者有默认实现，接入新算法更省事）。</text>
  <text x="680" y="248" font-size="10" fill="#94A3B8">用于签名、完整性校验与内部 MAC 密钥派生。</text>

  <!-- ═══ 第二行 ═══ -->
  <!-- 密钥派生 -->
  <rect x="40" y="274" width="298" height="164" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="58" y="302" font-size="13.5" font-weight="700" fill="#0F172A">密钥派生（IKM）</text>
  <text x="58" y="320" font-size="9.5" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Registry&lt;dyn KeyDerivation&gt; · KeyDerivationManager</text>
  <g font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="58" y="332" width="92" height="20" rx="10" fill="#EEF2FF"/><text x="104" y="346" fill="#4338CA" text-anchor="middle">hkdf-sha256</text>
  </g>
  <text x="58" y="374" font-size="10.5" fill="#475569">RFC 5869：把高熵材料展开为按用途的子密钥，</text>
  <text x="58" y="390" font-size="10.5" fill="#475569">derive(ikm, salt, length, info)。</text>
  <text x="58" y="406" font-size="10.5" fill="#475569">输出有上限（255 × 32 字节），越界报错。</text>
  <text x="58" y="426" font-size="10" fill="#94A3B8">不要用它拉伸人类口令 —— 那是口令派生的活。</text>

  <!-- 口令派生 -->
  <rect x="351" y="274" width="298" height="164" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="369" y="302" font-size="13.5" font-weight="700" fill="#0F172A">口令派生</text>
  <text x="369" y="320" font-size="9.5" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Registry&lt;dyn PasswordBasedKdf&gt; · PasswordBasedKdfManager</text>
  <g font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="369" y="332" width="102" height="20" rx="10" fill="#EEF2FF"/><text x="420" y="346" fill="#4338CA" text-anchor="middle">pbkdf2-sha256</text>
  </g>
  <text x="369" y="374" font-size="10.5" fill="#475569">随机盐 + 固定迭代数（构造参数，默认 310,000），</text>
  <text x="369" y="390" font-size="10.5" fill="#475569">derive_from_password(口令, salt, length)。</text>
  <text x="369" y="406" font-size="10.5" fill="#475569">迭代数必须为正、输出长度必须为正。</text>
  <text x="369" y="426" font-size="10" fill="#94A3B8">存储用户密码请改用 Argon2 / bcrypt 等专用 API。</text>

  <!-- 国密 -->
  <rect x="662" y="274" width="298" height="164" rx="14" fill="#FFFFFF" stroke="#C7D2FE"/>
  <text x="680" y="302" font-size="13.5" font-weight="700" fill="#0F172A">国密</text>
  <text x="680" y="320" font-size="9.5" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">guomi 模块 · 同一套契约与注册表</text>
  <g font-size="9.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="680" y="332" width="46" height="20" rx="10" fill="#EEF2FF"/><text x="703" y="346" fill="#4338CA" text-anchor="middle">sm2</text>
    <rect x="732" y="332" width="42" height="20" rx="10" fill="#EEF2FF"/><text x="753" y="346" fill="#4338CA" text-anchor="middle">sm3</text>
    <rect x="780" y="332" width="64" height="20" rx="10" fill="#EEF2FF"/><text x="812" y="346" fill="#4338CA" text-anchor="middle">sm4-cbc</text>
    <rect x="850" y="332" width="64" height="20" rx="10" fill="#EEF2FF"/><text x="882" y="346" fill="#4338CA" text-anchor="middle">zuc-128</text>
  </g>
  <text x="680" y="374" font-size="10.5" fill="#475569">不是独立 API：注册后经同一个 Manager 调用，</text>
  <text x="680" y="390" font-size="10.5" fill="#475569">与 AES / SHA-256 同等待遇（ZUC 已按 GB/T 向量校验）。</text>
  <text x="680" y="406" font-size="10.5" fill="#475569">SM1 / SM7 / SM9 → 明确的 Unsupported 错误，不静默。</text>
  <text x="680" y="426" font-size="10" fill="#94A3B8">纯 Rust 实现，无需任何系统扩展。</text>

  <!-- ═══ 底部三块 ═══ -->
  <rect x="40" y="452" width="298" height="188" rx="14" fill="#F5F3FF" stroke="#C4B5FD"/>
  <text x="58" y="480" font-size="13.5" font-weight="700" fill="#5B21B6">设计原则</text>
  <text x="58" y="506" font-size="11" fill="#4C1D95">· 一个能力一份契约（trait）</text>
  <text x="58" y="528" font-size="11" fill="#4C1D95">· 注册表按标识（identifier）解析</text>
  <text x="58" y="550" font-size="11" fill="#4C1D95">· 载荷前缀带格式版本（v1）</text>
  <text x="58" y="572" font-size="11" fill="#4C1D95">· 零框架耦合：集成全部是 opt-in feature</text>
  <text x="58" y="594" font-size="11" fill="#4C1D95">· 与原版同标识：切换成本为零</text>
  <text x="58" y="622" font-size="10" fill="#7C3AED">Rust 独立格式：结构与原版同形，但不承诺字节互通。</text>

  <rect x="351" y="452" width="298" height="188" rx="14" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="369" y="480" font-size="13.5" font-weight="700" fill="#166534">安全默认值</text>
  <text x="369" y="506" font-size="11" fill="#14532D">· 每次调用随机 IV / nonce</text>
  <text x="369" y="528" font-size="11" fill="#14532D">· AEAD 或 encrypt-then-MAC</text>
  <text x="369" y="550" font-size="11" fill="#14532D">· 常量时间比对（verify_slice / ct_eq）</text>
  <text x="369" y="572" font-size="11" fill="#14532D">· 32 字节主密钥强校验，构造期即报错</text>
  <text x="369" y="594" font-size="11" fill="#14532D">· 密钥材质 Drop 清零、Debug 遮蔽</text>
  <text x="369" y="622" font-size="10" fill="#15803D">解密失败不区分原因，不给攻击者 oracle。</text>

  <rect x="662" y="452" width="298" height="188" rx="14" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="680" y="480" font-size="13.5" font-weight="700" fill="#9A3412">扩展路径 —— 新增一个算法</text>
  <text x="680" y="506" font-size="11" fill="#7C2D12">1. 实现该族的契约 trait</text>
  <text x="680" y="528" font-size="11" fill="#7C2D12">2. identifier() 返回唯一标识</text>
  <text x="680" y="550" font-size="11" fill="#7C2D12">3. 注册进对应的 Registry</text>
  <text x="680" y="572" font-size="11" fill="#7C2D12">4. 通过任意门面调用</text>
  <text x="680" y="600" font-size="10" fill="#9A3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">manager.registry_mut()</text>
  <text x="680" y="616" font-size="10" fill="#9A3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">    .register(Box::new(MyCipher::new()));</text>
  <text x="680" y="632" font-size="10" fill="#C2410C">新算法 = 一个新类型 + 一次 register()，业务代码只依赖契约。</text>

  <text x="40" y="836" font-size="10" fill="#94A3B8">每族门面都提供「用默认算法」与「显式 *_with(identifier, …)」两组方法；标识与 PHP 版一致。</text>
  <text x="960" y="836" font-size="10" fill="#94A3B8" text-anchor="end">© 2026 erik · https://erik.xyz</text>
</svg>
